.workspace{position:relative;display:grid;grid-template-columns:272px minmax(0,1fr);min-height:0;height:auto;overflow:hidden}
.sidebar{min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column;padding:12px 0 0;background:var(--surface);border-right:1px solid var(--hover)}.tree-head{padding:4px 16px 10px;color:var(--faint);font-size:11px;line-height:16px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}.tree-row{display:flex;align-items:center;gap:6px;width:100%;min-height:24px;padding-right:12px;border:0;background:transparent;color:var(--soft);cursor:pointer;text-align:left;font-size:12.5px;line-height:16px;white-space:nowrap;transition:background 250ms var(--ease-out),color 250ms var(--ease-out)}.tree-row.file{color:var(--dim);cursor:default}.tree-row.dir:hover{background:var(--hover);color:var(--text)}.tree-chev{display:grid;flex:none;place-items:center;width:14px;height:14px;color:var(--faint)}.tree-chev svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform 250ms var(--ease-out)}.tree-row.dir.open .tree-chev svg{transform:rotate(90deg)}.tree-name{overflow:hidden;text-overflow:ellipsis}.tree-row.hot .tree-name{color:var(--accent)}.tree-ago{margin-left:auto;color:var(--accent);font:400 10px/16px var(--mono);font-variant-numeric:tabular-nums}:root[data-theme="light"] .tree-row.hot{background:var(--accent-bg);box-shadow:inset 2px 0 #e9a23b}:root[data-theme="light"] .tree-row.hot .tree-name,:root[data-theme="light"] .tree-row.hot .tree-ago{font-weight:600}.tree-empty{padding:16px;color:var(--faint);font-size:12px;line-height:16px}
.tree-add{display:flex;align-items:center;gap:8px;width:100%;min-height:30px;margin-top:8px;padding:0 16px;border:0;background:transparent;color:var(--faint);cursor:pointer;text-align:left;font-size:12.5px;transition:color 250ms var(--ease-out)}
.tree-add:hover{color:var(--text)}
.tree-add-form{padding:6px 12px 10px;display:flex;flex-direction:column;gap:6px}
.tree-add-form input{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raised);color:var(--text);font:400 12px var(--mono)}
.tree-add-form input:focus{outline:none;border-color:var(--faint)}
.tree-add-form .row{display:flex;gap:6px}
.tree-add-msg{color:var(--faint);font-size:11.5px;padding:0 2px}
.tree-sugg{display:flex;flex-direction:column;gap:2px;max-height:216px;overflow-y:auto}
.sugg-row{display:flex;flex-direction:column;gap:1px;width:100%;padding:6px 10px;border:0;border-radius:8px;background:transparent;color:var(--text);cursor:pointer;text-align:left;transition:background 150ms var(--ease-out)}
.sugg-row:hover{background:var(--hover)}
.sugg-name{font-size:12.5px;font-weight:550}
.sugg-dir{font:400 10.5px var(--mono);color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);max-width:520px;padding:11px 18px;border-radius:12px;background:var(--raised);border:1px solid var(--line);color:var(--text);font-size:13px;line-height:18px;opacity:0;pointer-events:none;transition:opacity 250ms var(--ease-out),transform 250ms var(--ease-out);z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}.firstrun{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:16px;max-width:640px;padding:14px 20px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 12px 40px var(--shadow-strong)}.firstrun p{color:var(--dim);font-size:13px;line-height:18px;text-wrap:pretty;margin:0}.firstrun strong{color:var(--text);font-weight:600}.firstrun .btn{flex:none}.firstrun.inline{position:static;transform:none;max-width:none;margin-top:8px}
.zero{display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:600px;min-height:100%;margin:0 auto;padding:48px 32px}
.zero h1{font-size:24px;line-height:32px;font-weight:600;letter-spacing:-.03em}
.zero .zero-sub{color:var(--dim);text-wrap:pretty}
.zero-feed{display:flex;flex-direction:column;gap:2px;padding:10px 4px;border-radius:14px;background:var(--surface)}
.zero-row{display:flex;align-items:center;gap:10px;min-height:30px;padding:0 12px;font:400 12.5px/16px var(--mono);color:var(--soft)}
.zero-row .dot{flex:none;background:var(--accent)}
.zero-row:first-child .dot{animation:working-pulse 1.6s ease-in-out infinite}
.zero-row .zf{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.zero-row .za{margin-left:auto;color:var(--faint);flex:none;font-variant-numeric:tabular-nums}
.zero-empty{padding:14px 12px;color:var(--faint);font-size:12.5px}
.fleet{position:absolute;inset:0;z-index:3;display:none;overflow:auto;background:var(--bg);padding:56px 48px}
.fleet.on{display:block;animation:reveal 500ms var(--ease-out) both}
.fleet-head{max-width:1080px;margin:0 auto 22px;display:flex;align-items:baseline;gap:14px}
.fleet-head h1{font-size:22px;font-weight:600;letter-spacing:-.03em}
.fleet-head .fh-sub{color:var(--faint);font-size:12.5px}
.fleet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;max-width:1080px;margin:0 auto}
.fleet-card{position:relative;padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);cursor:pointer;transition:border-color 300ms var(--ease-out),background 300ms var(--ease-out)}
.fleet-card:hover{background:var(--raised);border-color:var(--faint)}
.fleet-card.glow{border-color:rgba(233,162,59,.55);box-shadow:0 0 24px rgba(233,162,59,.08)}
.fleet-name{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600}
.fleet-name .live-dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.fleet-card.glow .live-dot{background:var(--success);animation:working-pulse 1.6s ease-in-out infinite}
.fleet-minimap{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.fleet-sq{width:12px;height:12px;border-radius:3.5px;border:1.6px solid var(--faint)}
.fleet-sq.done{border-color:transparent;background:#3f7f57}
.fleet-sq.active{border-color:var(--accent)}
.fleet-sq.blocked{border-color:transparent;background:var(--danger)}
.fleet-sq.hot{box-shadow:0 0 8px rgba(233,162,59,.7);border-color:var(--accent)}

g-live{visibility:visible}.task-capsule-badge{display:flex;flex:none;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;color:#fff;background:#3f7f57;animation:capsule-pop 300ms var(--ease-out) both}.task-capsule-badge svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.task-capsule-copy{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;line-height:16px;font-weight:500}.task-capsule-amount{flex:none;color:var(--dim);font-size:12px;line-height:16px;font-variant-numeric:tabular-nums}.task-capsule-pill{display:inline-flex;flex:none;align-items:center;height:22px;padding:0 8px;border-radius:999px;color:var(--complete-text);background:var(--complete-bg);font-size:11px;line-height:16px;font-weight:var(--complete-weight)}.task-capsule-pill.revised{color:var(--accent);background:var(--accent-bg)}.task-capsule-pill.blocked{color:#e79490;background:rgba(219,107,103,.16)}.task-capsule-pill.now{color:#e08bb8;background:rgba(215,111,163,.16)}.task-capsule-pill.backlog{color:var(--faint);background:var(--hover)}.task-capsule.sess-ended{opacity:.5}.task-capsule.sess-ended .ring-live{visibility:hidden!important}.task-capsule-badge.blocked{background:var(--danger)}.agent-chip{display:inline-flex;flex:none;align-items:center;justify-content:center;width:16px;height:16px;font-size:11px;line-height:1;font-weight:600}.agent-chip.faded{opacity:var(--done-agent-opacity)}.task-capsule-chevron{display:flex;flex:none;align-items:center;justify-content:center;width:28px;height:28px;margin-left:-8px;border-radius:50%;color:var(--faint)}.task-capsule-chevron svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform 250ms var(--ease-out)}.task-capsule.open .task-capsule-chevron svg{transform:rotate(180deg)}.task-capsule-detail{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows 250ms var(--ease-out),opacity 200ms var(--ease-out)}.task-capsule.open .task-capsule-detail{grid-template-rows:1fr;opacity:1}.task-capsule-detail-clip{overflow:hidden}.task-capsule-detail-grid{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;margin-bottom:12px;padding:0 8px}.task-capsule-detail-line{width:1px;height:100%;margin:auto;background:var(--line)}.task-capsule-detail-list{display:flex;min-width:0;flex-direction:column;gap:4px}.task-capsule-detail-row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:20px;color:var(--dim);font-size:12px;line-height:16px;animation:capsule-detail-enter 300ms var(--ease-out) both}.task-capsule-detail-meta{overflow:hidden;color:var(--faint);font:400 11px/16px var(--mono);font-variant-numeric:tabular-nums;text-overflow:ellipsis;white-space:nowrap}.task-capsule.active .task-capsule-copy{color:var(--text)}@media(hover:hover) and (pointer:fine){.task-capsule:hover{background:var(--hover)}}@keyframes capsule-enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}@keyframes capsule-detail-enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes capsule-pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}@keyframes capsule-spin{to{transform:rotate(360deg)}}
@media(max-width:960px){.topbar{grid-template-columns:minmax(0,1fr) auto}.switcher{grid-column:1/-1;grid-row:2}.tab{flex:1;justify-content:center}.workspace{height:calc(100dvh - 113px);grid-template-columns:minmax(0,1fr) 288px}.watching{display:none}.plan-view{padding:32px 24px 64px}}@media(max-width:720px){.topbar{padding:8px 12px;gap:12px}.badge{max-width:128px;overflow:hidden;text-overflow:ellipsis}.workspace{display:block;height:auto;min-height:calc(100dvh - 105px);overflow:visible}.primary{min-height:calc(100dvh - 105px)}.plan-view{padding:32px 16px 64px}.intro{display:block}.summary{margin-top:24px;text-align:left}.phase-head{grid-template-columns:auto minmax(0,1fr) auto;gap:12px}.phase-meta{display:none}.phase-body{padding-left:12px}.inspector{position:relative;left:auto;right:auto;bottom:auto;max-height:none;margin:0 12px 12px;border:1px solid var(--line);border-radius:16px}.graph-view{min-height:calc(100dvh - 105px)}.canvas-hint{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}}
</style>

<script>
let M=null,W=[],BP='',lastGraphKey='',graphPos={},regions={},minZoom=0.15,graphZoom=1,graphPan={x:0,y:0},graphSize={width:0,height:0},graphNeedsFit=true,panGesture=null
const openGraphDetails=new Set(),openGraphTasks=new Set(),closedGraphTasks=new Set()
const openFolders=new Set(),closedFolders=new Set();let lastReveal=new Set()
const ns=id=>BP+':'+id
const expandedRoots=new Set(),treeCache={}
let addRepoOpen=false,addRepoFocus=false,addSuggestions=[]
async function openAddRepo(){addRepoOpen=true;addRepoFocus=true;try{addSuggestions=await(await fetch('/suggest')).json()}catch{addSuggestions=[]}renderTree()}
function renderAddSuggestions(){const box=document.getElementById('add-sugg');if(!box)return
  const q=(document.getElementById('add-path')?.value||'').trim().toLowerCase()
  const list=addSuggestions.filter(p=>!q||p.toLowerCase().includes(q)).slice(0,8)
  box.innerHTML=list.map(p=>{const name=p.split('/').pop(),dir=p.slice(0,p.length-name.length)
    return`<button type="button" class="sugg-row" onclick="pickSuggestion(this.dataset.p)" data-p="${esc(p)}"><span class="sugg-name">${esc(name)}</span><span class="sugg-dir">${esc(dir)}</span></button>`}).join('')||(q?`<div class="tree-add-msg">no known repo matches — full path works too</div>`:'')}
function pickSuggestion(p){const i=document.getElementById('add-path');if(i)i.value=p;submitAddRepo()}
function toast(msg,ms){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),ms||6000)}
let setupBusy=false
async function setupBoard(port){if(setupBusy)return;setupBusy=true;toast('setting up…')
  try{const r=await(await fetch('/setup-board',{method:'POST',body:JSON.stringify({port})})).json()
    if(r.ok&&r.prompt){try{await navigator.clipboard.writeText(r.prompt)
        toast('done — a note for your agent is on your clipboard. paste it to the agent working in this repo and the map draws itself.',12000)}
      catch{toast('set up. now ask the agent working in this repo to fill in PLAN.md — the map draws itself.',12000)}
      setTimeout(pollWorld,1500)}
    else toast(r.error||'could not set it up — that board may be running an older version; restart it and try again',9000)
  }catch{toast('could not reach the board',6000)}
  setTimeout(()=>setupBusy=false,4000)}
let addRepoBusy=false
async function submitAddRepo(){const i=document.getElementById('add-path'),msg=document.getElementById('add-msg');if(!i||!i.value.trim()||addRepoBusy)return
  addRepoBusy=true;setTimeout(()=>addRepoBusy=false,8000)
  msg.textContent='starting the board…'
  try{const r=await(await fetch('/spawn',{method:'POST',body:JSON.stringify({path:i.value.trim()})})).json()
    if(r.ok&&r.already)msg.textContent='already on the map — flying there';if(r.ok&&r.already)setTimeout(()=>{flyToRegion(r.already);addRepoOpen=false;renderTree()},600)
    else if(r.ok){msg.textContent='started — appearing shortly…';setTimeout(()=>{addRepoOpen=false;pollWorld()},5000)}
    else msg.textContent=r.error||'could not start it'
  }catch{msg.textContent='could not reach the daemon'}}
const openRuns=new Set()
const $=id=>document.getElementById(id)
function syncTheme(){const light=document.documentElement.dataset.theme==='light',toggle=$('theme-toggle'),label=$('theme-toggle-label');if(toggle){toggle.setAttribute('aria-checked',String(light));toggle.setAttribute('aria-label',light?'Use dark theme':'Use light theme')}if(label)label.textContent=light?'Dark':'Light';document.querySelector('meta[name="theme-color"]')?.setAttribute('content',light?'#fff':'#000')}
function toggleTheme(){const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;try{localStorage.setItem('at-theme',next)}catch{}syncTheme()}
syncTheme()
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))

function copyBackfill(){copy('Read the "agenttrail plan convention" section in CLAUDE.md or AGENTS.md. Then study this repo in trust order — the code and directory layout first (what exists), git log for what is actually recent, decision logs and any in-progress build/handoff docs for what is in flight, and README/roadmap prose LAST and only for open intent (founding docs rot; cross-check their claims against git log) — and rewrite PLAN.md as the real map of this codebase: components with stable {#id}s, needs:/links: edges between them, files: globs for the paths each owns, and verb-led concrete titles with tech: sublines. Keep it to 5-9 components no matter how big the repo — a component is a part one agent could own for a session, with its own doneness and at least one edge; anything smaller is a task inside one, and stable plumbing folds into a neighbor while active or planned areas get their own card. Verify every status against the CODE, not the docs — READMEs and roadmaps rot; mark [x] only after finding the implementing source or artifact, and cite that evidence on its tech: line (e.g. tech: TurnView.swift) so a human can audit every tick; if you cannot find evidence, leave it unchecked and say so in the decisions note. Statuses must be honest — [x] only for what verifiably exists, [~] only for what you are working on right now, everything else [ ]. Tag open tasks with an indented from: line naming provenance — from: agent when an in-progress build/handoff doc or your own declared intent claims it imminently, from: roadmap when sourced only from planning docs; omit when unsure. Record the backfill under ## decisions.')}
let lastRunsHtml=''
function renderRuns(){
  const boards=boardsAll()
  const runs=boards.flatMap(b=>(b.runs||[]).map(x=>({...x,__port:b.port,__project:b.project,__plan:b.plan})))
  const groups=[]
  for(const b of boards){
    const rs=(b.runs||[]).map(x=>runs.find(r=>r.__port===b.port&&r.id===x.id)).filter(Boolean).sort((a,c)=>a.startedAt-c.startedAt)
    let g=null

  }
  groups.sort((a,c)=>a.start-c.start)

    const d=new Date(g.start),now=new Date()
    const day=d.toDateString()===now.toDateString()?'Today':d.toLocaleDateString([],{weekday:'short',month:'short',day:'numeric'})

      ${cur?`<div class="run-task">${esc(cur.content)}</div>`:r.ended?`<div class="run-task" style="color:var(--dim)">Idle — waiting for you</div>`:''}
      ${toolLine}
      <div class="run-detail">${todos}${hist?`<div style="margin-top:8px">${hist}</div>`:''}</div>
    </div>`}).join('')).join('')
  let hint=''

    const selfLive=(M.runs||[]).some(r=>!r.ended)
    const hot=M.activity&&Date.now()-M.activity.at<120000
