    if(ft){const comp=M.plan.find(x=>x.id===g.dataset.id),a=comp&&(comp.recent||[])[0]
      ft.textContent=live[g.dataset.id]&&a?`${a.file.split('/').pop()}${a.n>1?` ×${a.n}`:''} · ${ago(a.at)}`:''}}
  for(const g of document.querySelectorAll('g.graph-detail[data-detail]')){const id=g.dataset.detail
    const comp=M.plan.find(x=>x.id===id);if(!comp)continue
    const kidsOf=M.plan.filter(x=>x.parent===id)
    const declared=kidsOf.some(x=>x.status==='active'||x.status==='blocked')
    const inferred=live[id]&&!declared?(kidsOf.find(x=>x.status!=='done')||null):null
    for(const cap of g.querySelectorAll('.task-capsule[data-task]'))cap.classList.toggle('obs-spin',!!inferred&&cap.dataset.task===inferred.id)
    for(const el of g.querySelectorAll('[data-dl-task]')){const t=kidsOf.find(x=>x.id===el.dataset.dlTask);if(!t)continue
      const isLive=!!(comp.recent||[]).length&&(t.status==='active'||t.status==='blocked'||(inferred&&t.id===inferred.id)||(live[id]&&!declared&&t.status==='done'&&!inferred))
      if(isLive){const rows=(comp.recent||[]).slice(0,4).map(a=>`<div class="task-capsule-detail-row"><span>${esc(a.file)}${a.n>1?` ×${a.n}`:''}</span><span class="task-capsule-detail-meta">${ago(a.at)}</span></div>`)
        if(el.dataset.tech)rows.push(`<div class="task-capsule-detail-row"><span style="opacity:.6">${esc(el.dataset.tech)}</span><span class="task-capsule-detail-meta"></span></div>`)
        el.innerHTML=rows.join('');el.dataset.obsLines='1'}
      else if(el.dataset.obsLines){const rows=[]
        if(el.dataset.tech)rows.push(`<div class="task-capsule-detail-row"><span>${esc(el.dataset.tech)}</span><span class="task-capsule-detail-meta"></span></div>`)
        if(!rows.length)rows.push('<div class="task-capsule-detail-row"><span>No activity recorded yet</span><span class="task-capsule-detail-meta"></span></div>')
        el.innerHTML=rows.join('');delete el.dataset.obsLines}}}}
window.addEventListener('resize',()=>{if(view==='graph')fitGraph()})
</script>
</body>
</html>
